<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Error | CryptoStego</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='animations.css') }}">

</head>

<body>

<nav class="dashboard-nav">

    <div class="logo">

        <img src="{{ url_for('static', filename='images/logo.png') }}"
             alt="CryptoStego Logo">

    </div>

    <a href="/dashboard" class="logout-btn">
        Dashboard
    </a>

</nav>


<section class="message-container">

    <div class="error-card">

        <!-- Error Image -->

        <div class="error-visual">

            <img src="{{ url_for('static', filename='images/error.jpg') }}"
                 alt="Operation Failed">

        </div>


        <h1>
            Operation Failed
        </h1>


        <p>
            Something went wrong while processing your request.
        </p>


        {% if message %}

        <div class="error-message">
            {{ message }}
        </div>

        {% endif %}


        <div class="message-buttons">

            <a href="{{ back or '/dashboard' }}"
               class="outline-btn">

                Try Again

            </a>


            <a href="/history"
               class="outline-btn">

                View History

            </a>

        </div>

    </div>

</section>

</body>

</html>
